# Baut den Kalender aus data/events.json (vom Server) und termine.txt (eigene Termine)
# und veröffentlicht ihn zusammen mit der Abo-Seite auf GitHub Pages.
name: Kalender veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - data/**
      - termine.txt
      - docs/**
      - src/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/build.js --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
